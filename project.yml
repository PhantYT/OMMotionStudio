name: OMMotionStudio

options:
  bundleIdPrefix: com.phantyt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "OM Motion Studio"
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Bluetooth используется для подключения к DJI OM 7P."
    INFOPLIST_KEY_NSCameraUsageDescription: "Камера используется для видеозаписи."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Микрофон используется для записи звука."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Приложение сохраняет записанные видео в медиатеку."

targets:
  OMMotionStudio:
    type: application
    platform: iOS
    sources:
      - path: OMMotionStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phantyt.ommotionstudio
        PRODUCT_NAME: "OM Motion Studio"
        INFOPLIST_KEY_CFBundleDisplayName: "OM Motion Studio"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
