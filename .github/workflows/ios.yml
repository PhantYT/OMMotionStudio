
name: Build OM Motion Studio iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d OMMotionStudio.xcodeproj

      - name: Show schemes
        run: |
          xcodebuild -list -project OMMotionStudio.xcodeproj

      - name: Build application
        run: |
          xcodebuild \
            -project OMMotionStudio.xcodeproj \
            -scheme OMMotionStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OMMotionStudio.app Payload/
          zip -r OMMotionStudio-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OM-Motion-Studio-unsigned-IPA
          path: OMMotionStudio-unsigned.ipa
          retention-days: 14
