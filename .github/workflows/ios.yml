
name: OM Motion Studio - iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build OM Motion Studio
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          test -f project.yml || {
            echo "ERROR: project.yml not found!"
            exit 1
          }

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d OMMotionStudio.xcodeproj
          echo "Xcode project generated successfully"

      - name: Show available schemes
        run: |
          xcodebuild -list -project OMMotionStudio.xcodeproj

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project OMMotionStudio.xcodeproj \
            -scheme OMMotionStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OMMotionStudio.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload OMMotionStudio-unsigned.ipa
          ls -lh OMMotionStudio-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMMotionStudio-unsigned-IPA
          path: OMMotionStudio-unsigned.ipa
          retention-days: 7
