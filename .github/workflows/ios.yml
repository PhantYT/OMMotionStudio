
name: Build OM Motion Studio iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d OMMotionStudio.xcodeproj

      - name: Show schemes
        run: |
          xcodebuild -list -project OMMotionStudio.xcodeproj

      - name: Build application
        run: |
          xcodebuild \
            -project OMMotionStudio.xcodeproj \
            -scheme OMMotionStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Package IPA
        run: |
          mkdir -p Payload

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::Не найден собранный .app"
            exit 1
          fi

          echo "Найдено приложение: $APP_PATH"

          cp -R "$APP_PATH" Payload/
          zip -r OMMotionStudio-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OM-Motion-Studio-unsigned-IPA
          path: OMMotionStudio-unsigned.ipa
          retention-days: 14
